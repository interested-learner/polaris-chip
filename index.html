<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Boilerplate for polaris chip">
  <base href="/">

  <style>
    :root,
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #ededed;
    }
    polaris-chip {
      margin: 16px;
    }
    my-card {
      --my-card-title-color: orange;
      --my-card-paragraph-color: purple;
      --my-card-button-text-color: white;
    }
  </style>
  <title>polaris-chip / my-card</title>
</head>

<body>
  <h1>polaris-chip</h1>
  <!-- this is going to do whatever the tag's defaults are -->
  <polaris-chip title="News of Record" link="https://psu.edu/"></polaris-chip>
  <polaris-chip title="Faculty and Staff"></polaris-chip>
  <polaris-chip title="Sports are the only thing that matter"></polaris-chip>
  <polaris-chip title="Grants and donations"></polaris-chip>
  <h1>my-card</h1>

  <my-card></my-card>
  <my-card 
  title="John Cena"
  paragraph="This is John Cena, the greatest wrestler of all time. He has won 16 world championships and is a 5-time United States champion."
  buttonText="Click!"
  alt="My boy John Cena"
  image="https://hips.hearstapps.com/hmg-prod/images/john-cena-attends-the-world-premiere-of-argylle-at-the-news-photo-1744814847.pjpeg?crop=1.00xw:0.698xh;0,0.0193xh&resize=1024:*"></my-card>

  <my-card
  title="Turtle"
  paragraph="This is a turtle, a slow-moving reptile known for its hard shell and longevity. Turtles are found in various habitats around the world."
  buttonText="Click me!"
  alt="Green Turtle"
  image="https://opb-opb-prod.cdn.arcpublishing.com/resizer/v2/QITEYZ22ABMF3CEKJLKRAGUJEM.jpg?auth=be462926661de61c169dc57f27c9ff4e92434c1b3360879418be556d5cac424f&width=2046">
</my-card>

<my-card
title="Batman"
  paragraph="This is Batman, the Dark Knight of Gotham City. A vigilante superhero who fights crime using his intellect, physical prowess, and an array of high-tech gadgets."
  buttonText="Click here!!!!"
  alt="Batman"
  image="https://upload.wikimedia.org/wikipedia/en/c/c7/Batman_Infobox.jpg">
</my-card>

<my-card
title="Alien"
  paragraph="This is an alien, a hypothetical extraterrestrial being that may exist beyond Earth. Aliens are often depicted in science fiction as having various forms and abilities."
  buttonText="Alien click!"
  alt="Green alien"
  image="https://static.scientificamerican.com/dam/m/2a63d59b62cb6c52/original/Xenolinguistics_alien_lauguage.jpeg?m=1743695744.971&w=1350">
</my-card>

</body>



<script type="module" src="./src/polaris-chip.js"></script>
<script type="module" src="./src/my-card.js"></script>

</html>
